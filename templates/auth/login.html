{% extends "base.html" %}
{% block title %}Sign in — ColorVibe{% endblock %}
{% block body_class %}has-auth{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Sign in</h1>
        <p class="auth-sub">Your saved palettes are waiting.</p>

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">
            <p class="field-error" data-error-for="email" hidden></p>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <p class="field-error" data-error-for="password" hidden></p>

            <button type="submit" class="btn btn--primary btn--block">Sign in</button>
        </form>

        <p class="auth-switch">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
