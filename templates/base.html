<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ColorVibe — Palette Generator{% endblock %}</title>
    <meta name="description" content="Generate, lock, and save color palettes with harmony rules built for designers and developers.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "partials/navbar.html" %}

    <main class="page-main">
        {% include "partials/flash.html" %}
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>ColorVibe &mdash; built with Flask, MySQL &amp; vanilla JS.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
