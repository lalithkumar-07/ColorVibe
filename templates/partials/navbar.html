<nav class="navbar">
    <a href="{{ url_for('main.index') }}" class="nav-brand">
        <span class="nav-brand-mark" aria-hidden="true"></span>
        ColorVibe
    </a>

    <div class="nav-links">
        {% if is_logged_in %}
            <a href="{{ url_for('palette.dashboard') }}" class="nav-link">My palettes</a>
            <span class="nav-username">{{ current_username }}</span>
            <form action="{{ url_for('auth.logout') }}" method="POST" class="nav-logout-form">
                <button type="submit" class="nav-link nav-link--btn">Sign out</button>
            </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="nav-link">Sign in</a>
            <a href="{{ url_for('auth.register') }}" class="nav-link nav-link--cta">Create account</a>
        {% endif %}
    </div>
</nav>
